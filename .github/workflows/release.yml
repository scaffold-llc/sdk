name: Release

# Every change the platform repository mirrors here that touches the package is a release.
# npm publishes with the NPM_TOKEN secret, a granular token with publish rights on the package;
# the workflow's OIDC token signs the provenance.
on:
  push:
    branches: [main]
    paths: [src/**, package.json]

concurrency: release

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Version as major.minor from package.json and this run's number
        run: npm version --no-git-tag-version "$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').${{ github.run_number }}"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
